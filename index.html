<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Il Cappello Parlante</title><style>body{margin:0;background:radial-gradient(circle at 50% 15%,#35405a,#101321 70%);color:#f6e9c8;font-family:Georgia,serif;text-align:center;min-height:100vh}main{max-width:540px;margin:auto;padding:22px 18px 50px}h1{font-size:2.15rem;margin:10px 0}p{line-height:1.5}.hat{width:min(82vw,310px);display:block;margin:12px auto;filter:drop-shadow(0 15px 12px #0008)}button{font:700 1.05rem Georgia,serif;border:1px solid #e2c78a;border-radius:18px;background:#e2c78a;color:#231a14;padding:16px 24px;margin:10px;cursor:pointer}button.secondary{background:transparent;color:#f6e9c8}button:disabled{opacity:.45}.panel{background:#151724aa;border:1px solid #bba26d77;border-radius:20px;padding:20px;margin-top:18px}#status{font-style:italic;min-height:48px}#transcript{color:#dfc998}#result{font-size:1.5rem;color:#ffdc83}small{color:#c8bdad}input{font:1.1rem Georgia,serif;padding:13px;border-radius:12px;max-width:85%;box-sizing:border-box}</style></head><body><main><h1>Il Cappello Parlante</h1><p>Quattro Case. Una sola sentenza. E nessuna possibilità di appello.</p><svg class="hat" viewBox="0 0 360 330" role="img" aria-label="Cappello parlante marrone, alto e stropicciato, con occhi e bocca"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#3b241a"/><stop offset=".5" stop-color="#8b5733"/><stop offset="1" stop-color="#352017"/></linearGradient></defs><path d="M60 263 Q105 234 124 185 Q142 137 161 94 Q169 64 226 19 Q209 65 239 89 Q250 121 238 158 Q259 211 284 258 Q309 262 335 283 Q297 309 183 304 Q59 307 21 281 Q31 269 60 263Z" fill="url(#g)" stroke="#2b1b15" stroke-width="7"/><path d="M129 181 Q162 160 195 184 M214 182 Q239 165 254 176" stroke="#29180f" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M145 222 Q185 202 230 223 Q195 235 175 254 Q161 233 145 222Z" fill="#1c100d" stroke="#26150f" stroke-width="6"/><path d="M95 267 Q180 287 281 263" fill="none" stroke="#28160f" stroke-width="14"/><path d="M120 115 Q149 103 157 80 M236 110 Q220 126 228 147" stroke="#c78c55" stroke-width="6" opacity=".5" fill="none"/></svg><div class="panel"><p id="status">Tocca il pulsante: il Cappello inizierà a parlare.</p><button id="start">🎩 Indossa il Cappello</button><div id="namePanel" hidden><p>Come ti chiami?</p><input id="name" maxlength="60" placeholder="Il tuo nome" autocomplete="given-name"><p><button id="nameVoice" class="secondary">🎙️ Di' il tuo nome</button><button id="nameNext">Continua</button></p></div><div id="controls" hidden><p id="question"></p><button id="talk">🎙️ Rispondi a voce</button><button id="again" class="secondary">Riascolta</button><p id="transcript"></p><div id="fallback"><p>Oppure scegli una risposta:</p><div id="choices"></div></div></div><p id="result" aria-live="polite"></p><button id="reset" class="secondary" hidden>Nuovo smistamento</button></div><small>La voce dipende dal browser. Il microfono può richiedere l'autorizzazione. Nessuna password per gli invitati.</small></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getFirestore,doc,runTransaction,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyBDbMXD3RJ-H2DtkgULuepPiJtmluokjyw',authDomain:'cappello-parlante-natale.firebaseapp.com',projectId:'cappello-parlante-natale',storageBucket:'cappello-parlante-natale.firebasestorage.app',messagingSenderId:'568505318995',appId:'1:568505318995:web:41168aa9b31847512d90a6'};
const db=getFirestore(initializeApp(firebaseConfig));
const qs=[{q:'Quando scoppia il caos, tu che fai?',a:['Mi lancio senza pensarci troppo','Studio la situazione e trovo una soluzione','Proteggo le persone a cui tengo','Cerco il modo migliore per uscirne vincitore']},{q:'Quale qualità ti descrive meglio?',a:['Il coraggio','La curiosità','La lealtà','L’ambizione']},{q:'Ti offrono un potere magico. Quale scegli?',a:['Affrontare qualsiasi paura','Conoscere ogni segreto','Aiutare chiunque ne abbia bisogno','Convincere chiunque a darmi ragione']}];
const houses=['Grifondoro','Corvonero','Tassorosso','Serpeverde'];let step=0,scores=[0,0,0,0],answers=[],guest='',voiceText='',busy=false;const $=id=>document.getElementById(id);const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function say(t){voiceText=t;$('status').textContent=t;if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.9;u.pitch=.78;speechSynthesis.speak(u)}
function ask(){if(step>=qs.length){finish();return}let x=qs[step];$('question').textContent=x.q;$('transcript').textContent='';$('choices').innerHTML='';x.a.forEach((v,i)=>{let b=document.createElement('button');b.className='secondary';b.textContent=(i+1)+'. '+v;b.onclick=()=>answer(i);$('choices').appendChild(b)});say(['Oh, un altro aspirante mago. Vediamo se hai qualcosa sotto quel cranio. ','Non cantare vittoria. ','Ultima domanda. Cerca di non deludermi. '][step]+x.q+' '+x.a.map((v,i)=>'Opzione '+(i+1)+': '+v+'.').join(' '))}
function answer(i){if(busy)return;scores[i]++;answers.push(i);step++;ask()}
async function finish(){if(busy)return;busy=true;$('controls').hidden=true;$('status').textContent='Il Cappello sta consultando il registro delle Case...';const counter=doc(db,'smistamento','contatori');const entry=doc(db,'partecipanti',crypto.randomUUID());try{const h=await runTransaction(db,async tx=>{const snap=await tx.get(counter);const counts=snap.exists()?snap.data().counts:[0,0,0,0];if(!Array.isArray(counts)||counts.length!==4||counts.some(x=>!Number.isInteger(x)||x<0))throw Error('Contatori non validi');const min=Math.min(...counts);const eligible=counts.map((c,i)=>c===min?i:-1).filter(i=>i>=0);const best=Math.max(...eligible.map(i=>scores[i]));const tied=eligible.filter(i=>scores[i]===best);const winner=tied[Math.floor(Math.random()*tied.length)];const next=counts.slice();next[winner]++;tx.set(counter,{counts:next});tx.set(entry,{nome:guest,casa:houses[winner],risposte:answers,creatoIl:serverTimestamp()});return houses[winner]});$('result').textContent=guest+', la tua Casa è '+h+'!';$('reset').hidden=false;say('Mmm, '+guest+'. Un caso interessante. Non necessariamente rassicurante. Ho deciso: '+h+'! E adesso vai, prima che cambi idea.')}catch(e){console.error(e);$('result').textContent='Il registro non è raggiungibile. Nessuna Casa è stata assegnata: riprova.';$('retry').hidden=false;$('status').textContent='Verifica che la connessione e le regole Firebase siano attive.'}finally{busy=false}}
function parseAnswer(s){let t=s.toLowerCase();let words=['uno','due','tre','quattro'];for(let i=0;i<4;i++)if(t.includes(words[i])||t.includes(String(i+1))||qs[step].a[i].toLowerCase().split(' ').some(w=>w.length>5&&t.includes(w)))return i;return -1}
function listen(onText){if(!SR){$('status').textContent='Il riconoscimento vocale non è disponibile: usa i pulsanti o scrivi il nome.';return}let r=new SR();r.lang='it-IT';r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>onText(e.results[0][0].transcript);r.onerror=e=>$('status').textContent='Microfono non disponibile: '+e.error+'. Usa i pulsanti o scrivi il nome.';try{if('speechSynthesis'in window)speechSynthesis.cancel();r.start();$('status').textContent='Ti ascolto...'}catch(e){$('status').textContent='Non riesco ad attivare il microfono.'}}
$('start').onclick=()=>{$('start').hidden=true;$('namePanel').hidden=false;say('E tu chi saresti? Dimmi il tuo nome, così saprò chi incolpare se qualcosa va storto!')};$('nameVoice').onclick=()=>listen(s=>{$('name').value=s;$('status').textContent='Ho sentito: '+s+'. Premi Continua.'});$('nameNext').onclick=()=>{guest=$('name').value.trim().replace(/\s+/g,' ');if(!guest){$('status').textContent='Prima il nome, aspirante mago. Non sono mica un indovino!';return}$('namePanel').hidden=true;$('controls').hidden=false;ask()};$('again').onclick=()=>say(voiceText);$('reset').onclick=()=>{step=0;scores=[0,0,0,0];answers=[];guest='';$('name').value='';$('result').textContent='';$('reset').hidden=true;$('namePanel').hidden=false;say('Un altro candidato? Dimmi il tuo nome.')};$('talk').onclick=()=>listen(s=>{$('transcript').textContent='Hai detto: '+s;let i=parseAnswer(s);if(i>=0)answer(i);else say('Non ho capito. Rispondi con uno, due, tre o quattro.')});
</script><script>document.addEventListener('DOMContentLoaded',()=>{let b=document.createElement('button');b.id='retry';b.className='secondary';b.hidden=true;b.textContent='Riprova registrazione';b.onclick=()=>location.reload();document.querySelector('.panel').appendChild(b)})</script></body></html>
